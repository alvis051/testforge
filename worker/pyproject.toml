[project]
name = "testforge-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "typer>=0.15"]

[project.scripts]
tf-worker = "testforge_worker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testforge_worker"]
