[project]
name = "testforge-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "plugin"]

[tool.uv.sources]
testforge = { workspace = true }
pytest-testforge = { workspace = true }

[dependency-groups]
dev = [
    "testforge",
    "pytest-testforge",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "httpx2>=2.9.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "typer.Option",
]

[tool.pytest.ini_options]
testpaths = ["server/tests", "plugin/tests"]
